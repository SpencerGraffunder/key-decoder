name: KeyDecoder

options:
  bundleIdPrefix: com.keydecoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  knownRegions:
    - en

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_INHIBIT_ALL_WARNINGS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  KeyCore:
    type: framework
    platform: iOS
    sources:
      - path: KeyCore
    settings:
      base:
        PRODUCT_NAME: KeyCore
        PRODUCT_BUNDLE_IDENTIFIER: com.keydecoder.core
        INFOPLIST_FILE: KeyCore/Support/Info.plist
        DEFINES_MODULE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  KeyDecoderApp:
    type: application
    platform: iOS
    sources:
      - path: KeyDecoderApp
    dependencies:
      - target: KeyCore
    settings:
      base:
        PRODUCT_NAME: KeyDecoder
        PRODUCT_MODULE_NAME: KeyDecoder
        PRODUCT_BUNDLE_IDENTIFIER: com.keydecoder.app
        INFOPLIST_FILE: KeyDecoderApp/Support/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"

  KeyDecoderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: KeyDecoderApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keydecoder.tests
        INFOPLIST_FILE: Tests/Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  KeyDecoder:
    build:
      targets:
        KeyDecoderApp: all
        KeyDecoderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeyDecoderTests
    archive:
      config: Release
