#
# iOS CI — build the KeyDecoder iOS app and publish an unsigned .ipa.
#
#   build      — on PRs / branch pushes that touch app code: compile check only.
#   tests-ipa  — on a push to main, a tag push (v*), or manual "Run workflow":
#                simulator unit tests, then a Release build packaged as
#                KeyDecoder.ipa — uploaded as a run artifact AND published as
#                a GitHub Release. Tag pushes publish under their tag name;
#                everything else refreshes the rolling 'ios-latest' release.
#
# The .ipa is UNSIGNED by design (free app, no paid Apple developer account):
# re-sign it with your free Apple ID via Sideloadly / AltStore / Xcode to install.
#
# Download path: the GitHub Release asset is the BARE .ipa (Actions run
# artifacts are always zip-wrapped, so they are convenience copies only).
#
name: ios

on:
  push:
    branches: [ main ]
    # Docs-only pushes must not burn 30 mac minutes rebuilding the same ipa.
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v*'
  workflow_dispatch:  # NB: no pull_request — self-hosted runners must never
                       # execute unreviewed fork code on Spec's Mac.

# Needed to publish the .ipa as a release asset.
permissions:
  contents: write

# LaunchAgent services get a minimal PATH; /usr/bin/jq is not a macOS guarantee.
env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') &&
       github.ref != 'refs/heads/main')
    runs-on: [self-hosted, nuclear-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile check (Release, unsigned, no tests)
        run: |
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

  tests-ipa:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, nuclear-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Rolling version (date + run number)
        run: |
          # LiveContainer shows CFBundleShortVersionString; a static 1.0 made
          # every sideloaded build indistinguishable. yy.m.d + CI run number.
          echo "APP_VERSION=$(date -u +%y.%-m.%-d)" >> "$GITHUB_ENV"
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run unit tests (iOS simulator)
        run: |
          SIM=$(xcrun simctl list devices available --json \
                | jq -r '.devices[] | .[] | select(.name | contains("iPhone")) | .name' \
                | head -1)
          echo "Using simulator: $SIM"
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath dd-sim \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Build Release for iOS device
        run: |
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

      - name: Assemble .ipa
        run: |
          APP=$(find dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Bundling $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          # Stamp a distinct version into the staged app: the committed
          # Info.plist stays 1.0 for local dev, which made EVERY rolling
          # build report "1.0" — LiveContainer reads
          # CFBundleShortVersionString, so builds were indistinguishable
          # and looked stale. The run number always increases; v* tag
          # pushes carry the real tag version instead.
          if [ -n "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
          else
            BUILD_VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $BUILD_VERSION" \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "ipa-staging/Payload/$(basename "$APP")/Info.plist"
          echo "Version stamped: $BUILD_VERSION (build $GITHUB_RUN_NUMBER)"
          cd ipa-staging
          zip -qry ../KeyDecoder.ipa Payload
          cd ..
          ls -lh KeyDecoder.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDecoder.ipa
          path: KeyDecoder.ipa
          if-no-files-found: error

      - name: Publish .ipa as GitHub Release (bare file, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag pushes publish under their tag name; everything else
          # refreshes the rolling 'ios-latest' release. Release assets
          # download as the bare .ipa — that is the download path the
          # pianobar-ios site links to (Actions artifacts are always
          # zipped, hence they are convenience copies only).
          TAG=ios-latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KeyDecoder.ipa --clobber
          else
            gh release create "$TAG" KeyDecoder.ipa \
              --title "iOS build ($TAG)" \
              --notes "Unsigned .ipa from CI. Re-sign with Sideloadly / AltStore / an ad-hoc profile to install."
          fi
          gh release view "$TAG"

      - name: Mirror .ipa to iCloud Drive
        continue-on-error: true
        run: |
          # This runner IS Spec's Mac, so a local copy into iCloud Drive IS
          # the upload (bird syncs it to the account within seconds; no cron,
          # no tokens). continue-on-error: a sync hiccup must never redden a
          # build — the GitHub Release stays the canonical download.
          DEST="$HOME/Library/Mobile Documents/com~apple~CloudDocs/IPAs"
          mkdir -p "$DEST"
          cp -f KeyDecoder.ipa "$DEST/KeyDecoder.ipa"
          ls -lh "$DEST"
