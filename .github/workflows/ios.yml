#
# iOS CI — build the KeyDecoder iOS app and publish an unsigned .ipa.
#
#   build      — on pushes to non-main branches: compile check only.
#   tests-ipa  — on a push to main or manual "Run workflow": simulator unit
#                tests, then a Release build packaged as
#                KeyDecoder-<version>-<build>.ipa — uploaded as a run artifact
#                AND published as ITS OWN GitHub Release, tagged and titled
#                with the exact version stamped into the IPA (e.g.
#                26.11.3-19 / "KeyDecoder 26.11.3 (19)"). One release per
#                build; each is marked --latest so releases/latest (and the
#                website download button) always resolves to the newest build.
#
# The .ipa is UNSIGNED by design (free app, no paid Apple developer account):
# re-sign it with your free Apple ID via Sideloadly / AltStore / Xcode to install.
#
# Download path: the GitHub Release asset is the BARE .ipa (Actions run
# artifacts are always zip-wrapped, so they are convenience copies only).
#
name: ios

on:
  push:
    branches: [ main ]
    # Docs-only pushes must not burn 30 mac minutes rebuilding the same ipa.
    paths-ignore:
      - '**.md'
      - 'docs/**'
    # NB: no tag trigger — version tags are CREATED by the release step of
    # main builds; triggering on them would double-build every push.
  workflow_dispatch:  # NB: no pull_request — self-hosted runners must never
                      # execute unreviewed fork code on Spec's Mac.

# Needed to publish the .ipa as a release asset.
permissions:
  contents: write

# LaunchAgent services get a minimal PATH; /usr/bin/jq is not a macOS guarantee.
env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  build:
    if: >-
      github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: [self-hosted, nuclear-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile check (Release, unsigned, no tests)
        run: |
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

  tests-ipa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, nuclear-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Rolling version (date + run number)
        run: |
          # LiveContainer shows CFBundleShortVersionString; a static 1.0 made
          # every sideloaded build indistinguishable. yy.m.d + CI run number.
          # THE SAME version stamps the bundle, the .ipa asset, the release
          # tag and the release title — what you install is what you see.
          echo "APP_VERSION=$(date -u +%y.%-m.%-d)" >> "$GITHUB_ENV"
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run unit tests (iOS simulator)
        run: |
          SIM=$(xcrun simctl list devices available --json \
                | jq -r '.devices[] | .[] | select(.name | contains("iPhone")) | .name' \
                | head -1)
          echo "Using simulator: $SIM"
          # Release, not Debug: the synthetic CV fixtures decode real-size
          # scenes and Debug pixel loops overrun xcodebuild's per-test
          # watchdog; its preempt-restart loop loses the whole suite.
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -configuration Release \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath dd-sim \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Build Release for iOS device
        run: |
          xcodebuild -project KeyDecoder.xcodeproj -scheme KeyDecoder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

      - name: Assemble .ipa (asset named with the version)
        run: |
          ASSET="KeyDecoder-${APP_VERSION}-${APP_BUILD}.ipa"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          APP=$(find dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Bundling $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          cd ipa-staging
          zip -qry ../"$ASSET" Payload
          cd ..
          ls -lh "$ASSET"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Publish per-build GitHub Release (bare .ipa asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per build on main, tag + title identical to the
          # version stamped into the IPA bundle. --latest keeps
          # releases/latest (the website download link and any
          # 'latest release' tooling) pointing at the newest build.
          TAG="${APP_VERSION}-${APP_BUILD}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "KeyDecoder ${APP_VERSION} (${APP_BUILD})" \
              --latest \
              --notes "Build ${APP_BUILD} of ${APP_VERSION}. Version visible in LiveContainer = CFBundleShortVersionString ${APP_VERSION} (${APP_BUILD}). Unsigned .ipa — re-sign with Sideloadly / AltStore / an ad-hoc profile to install."
          fi
          gh release view "$TAG"
          # Newest-only policy (2026-11-14, Spec standing rule): hub + iCloud
          # keep ONLY the current build. Prune superseded versioned releases
          # (the yy.m.d-<run> pattern never matches legacy or upstream-style
          # tags — those are cleaned manually, not by CI).
          OLD_TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                      --jq '.[].tag_name' \
                    | grep -E '^[0-9]{2}\.[0-9]+\.[0-9]+-[0-9]+$' \
                    | grep -v -x "$TAG" || true)
          for OLD in $OLD_TAGS; do
            echo "Pruning superseded release $OLD"
            gh release delete "$OLD" --yes --cleanup-tag
          done

      - name: Mirror .ipa to iCloud Drive
        continue-on-error: true
        run: |
          # This runner IS Spec's Mac, so a local copy into iCloud Drive IS
          # the upload (bird syncs it to the account within seconds; no cron,
          # no tokens). continue-on-error: a sync hiccup must never redden a
          # build — the GitHub Release stays the canonical download.
          DEST="$HOME/Library/Mobile Documents/com~apple~CloudDocs/IPAs"
          mkdir -p "$DEST"
          cp -f "$ASSET" "$DEST/$ASSET"
          # Newest-only policy: drop superseded KeyDecoder builds from the
          # shared collection folder (KeyDecoder prefix only — other apps'
          # files are pruned by their own pipelines).
          find "$DEST" -maxdepth 1 -type f -name 'KeyDecoder*.ipa' ! -name "$ASSET" -delete
          ls -lh "$DEST"
